<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found · ALHYDRA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- App CSS (AERVINEX-style design system) -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Ambient aura -->
    <div id="aura-layer" aria-hidden="true">
      <div class="aura-orb a1"></div>
      <div class="aura-orb a2"></div>
      <div class="aura-orb a3"></div>
      <div class="aura-orb a4"></div>
    </div>

    <main class="err-wrap">
      <div class="err-card">
        <div class="err-icon"><i class="fa-solid fa-leaf"></i></div>
        <div class="err-code">404</div>
        <h1 class="err-title">Page Not Found</h1>
        <p class="err-desc">
          The page you're looking for doesn't exist or has been moved.
          Let's get you back to monitoring your bioreactor.
        </p>
        <a href="/" class="err-btn"><i class="fa-solid fa-gauge-high"></i> Back to ALHYDRA</a>
      </div>
    </main>
  </body>
</html>
